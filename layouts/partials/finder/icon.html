{{- /* Inline icon set matching the DS icon names used in the handoff designs.
     Usage: partial "icon.html" (dict "name" "check-circle-filled" "size" 16) */ -}}
{{- $n := .name -}}
{{- $s := .size | default 16 -}}
<svg width="{{ $s }}" height="{{ $s }}" viewBox="0 0 24 24" fill="none" aria-hidden="true">
{{- if eq $n "check-circle-filled" -}}
<circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8 12.5l2.6 2.6L16 9.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
{{- else if eq $n "check-circle" -}}
<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M8.5 12.3l2.3 2.3 4.7-4.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
{{- else if eq $n "alert" -}}
<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v5.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.4" r="1.2" fill="currentColor"/>
{{- else if eq $n "chevron-right" -}}
<path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
{{- else if eq $n "chevron-down" -}}
<path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
{{- else if eq $n "external-link" -}}
<path d="M14 5h5v5M19 5l-8 8M19 13.5V18a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
{{- else if eq $n "help" -}}
<circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 3.1c-.7.4-1 .9-1 1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="16.8" r="1.1" fill="currentColor"/>
{{- else if eq $n "search" -}}
<circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M15.8 15.8L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
{{- else if eq $n "arrow-right" -}}
<path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
{{- end -}}
</svg>
